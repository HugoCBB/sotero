services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: sotero
      POSTGRES_PASSWORD: sotero
      POSTGRES_DB: sotero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
